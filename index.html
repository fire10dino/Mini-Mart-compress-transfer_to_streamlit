<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Mart</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        /* =========================
           GLOBAL
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: white;
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           LOGIN / REGISTER
        ========================= */

        #authPage {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #6a11cb,
                #2575fc
            );
            padding: 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 430px;
            background: white;
            color: #333;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .auth-box h1 {
            text-align: center;
            color: #2575fc;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: #777;
            font-size: 16px;
        }

        .auth-tab.active {
            color: #2575fc;
            border-bottom: 3px solid #2575fc;
            font-weight: bold;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-form label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
        }

        .auth-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .auth-button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 13px;
            background: #2575fc;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .auth-button:hover {
            background: #1b63d6;
        }

        .auth-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            display: none;
        }

        .auth-message.error {
            display: block;
            background: #ffe0e0;
            color: #b00000;
        }

        .auth-message.success {
            display: block;
            background: #dcffe5;
            color: #08752b;
        }

        /* =========================
           MAIN APP
        ========================= */

        #appPage {
            display: none;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            padding: 0 25px 50px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #000;
            border-bottom: 2px solid #333;
            padding: 20px 0;
        }

        .header-inner {
            max-width: 1400px;
            margin: auto;
            padding: 0 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            color: #2196F3;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .welcome {
            font-size: 16px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-button {
            border: none;
            background: #2196F3;
            color: white;
            padding: 10px 15px;
            border-radius: 7px;
            font-weight: bold;
        }

        .header-button:hover {
            background: #1976D2;
        }

        .cart-count {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 22px;
            height: 22px;
            padding: 0 5px;
            border-radius: 50%;
            background: white;
            color: #2196F3;
            margin-left: 5px;
            font-size: 12px;
        }

        /* =========================
           CATEGORY NAV
        ========================= */

        .category-nav {
            position: sticky;
            top: 84px;
            z-index: 90;
            background: #000;
            padding: 15px 0;
            border-bottom: 1px solid #222;
        }

        .category-nav-inner {
            max-width: 1400px;
            margin: auto;
            padding: 0 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .category-button {
            background: #000;
            border: 1px solid #2196F3;
            color: #2196F3;
            border-radius: 6px;
            padding: 8px 13px;
        }

        .category-button:hover {
            background: #2196F3;
            color: white;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .category-section {
            margin-top: 30px;
            scroll-margin-top: 160px;
        }

        .category-title {
            color: #2196F3;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );
            gap: 20px;
        }

        .product-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            transition: 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            border-color: #4CAF50;
        }

        .product-image {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            background: #292929;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-price {
            color: #2196F3;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .quantity-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .quantity-row button {
            width: 35px;
            height: 35px;
            border: 1px solid #555;
            background: #222;
            color: white;
            border-radius: 5px;
        }

        .quantity-value {
            min-width: 35px;
            text-align: center;
        }

        .add-button {
            width: 100%;
            background: #4CAF50;
            border: none;
            color: white;
            padding: 11px;
            border-radius: 6px;
            font-weight: bold;
        }

        .add-button:hover {
            background: #388E3C;
        }

        /* =========================
           OVERLAY
        ========================= */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 500;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* =========================
           CART SIDEBAR
        ========================= */

        #cartSidebar {
            position: fixed;
            right: -480px;
            top: 0;
            width: 450px;
            max-width: 95%;
            height: 100vh;
            background: #111;
            border-left: 2px solid #2196F3;
            z-index: 600;
            padding: 25px;
            overflow-y: auto;
            transition: right 0.3s;
        }

        #cartSidebar.active {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .close-button {
            border: none;
            background: transparent;
            color: white;
            font-size: 25px;
        }

        .cart-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .cart-item-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .cart-item-name {
            font-weight: bold;
        }

        .cart-item-price {
            color: #2196F3;
        }

        .remove-cart {
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 8px;
            margin-top: 8px;
        }

        .cart-total {
            border-top: 2px solid #333;
            margin-top: 20px;
            padding-top: 20px;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .checkout-button {
            width: 100%;
            margin-top: 15px;
            background: #2196F3;
            border: none;
            color: white;
            padding: 13px;
            border-radius: 7px;
            font-weight: bold;
        }

        /* =========================
           CHECKOUT
        ========================= */

        #checkoutModal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            max-width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            background: #111;
            border: 2px solid #2196F3;
            border-radius: 12px;
            padding: 30px;
            z-index: 700;
            display: none;
        }

        #checkoutModal.active {
            display: block;
        }

        #checkoutForm label {
            display: block;
            margin: 12px 0 6px;
        }

        #checkoutForm input,
        #checkoutForm textarea {
            width: 100%;
            padding: 11px;
            background: #222;
            border: 1px solid #555;
            color: white;
            border-radius: 6px;
        }

        #checkoutForm textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .form-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
        }

        .cancel-button {
            background: #555;
            color: white;
        }

        .submit-button {
            background: #2196F3;
            color: white;
        }

        /* =========================
           THANK YOU
        ========================= */

        #thankYouModal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            max-width: 95%;
            background: #111;
            border: 2px solid #4CAF50;
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            z-index: 800;
            display: none;
        }

        #thankYouModal.active {
            display: block;
        }

        #thankYouModal h2 {
            color: #4CAF50;
            margin-bottom: 15px;
        }

        .order-number {
            font-size: 1.5rem;
            color: #2196F3;
            font-weight: bold;
            margin: 20px 0;
        }

        /* =========================
           ORDER HISTORY
        ========================= */

        #historyModal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            max-width: 95%;
            max-height: 85vh;
            overflow-y: auto;
            background: #111;
            border: 2px solid #2196F3;
            border-radius: 12px;
            padding: 30px;
            z-index: 700;
            display: none;
        }

        #historyModal.active {
            display: block;
        }

        .history-order {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .history-order h3 {
            color: #2196F3;
            margin-bottom: 8px;
        }

        .history-order p {
            margin: 5px 0;
            color: #ccc;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {
            .header-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
                flex-wrap: wrap;
            }

            .logo {
                font-size: 2rem;
            }

            .category-nav {
                top: 145px;
            }

            #cartSidebar {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<!-- =========================================================
     AUTH PAGE
========================================================= -->

<div id="authPage">

    <div class="auth-box">

        <h1>🏪 Mini Mart</h1>
        <p class="auth-subtitle">
            Login or create an account
        </p>

        <div class="auth-tabs">
            <button
                class="auth-tab active"
                id="loginTab"
                onclick="showAuthForm('login')">
                Login
            </button>

            <button
                class="auth-tab"
                id="registerTab"
                onclick="showAuthForm('register')">
                Register
            </button>
        </div>

        <!-- LOGIN -->

        <form
            id="loginForm"
            class="auth-form active">

            <label>Username</label>

            <input
                type="text"
                id="loginUsername"
                required>

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                required>

            <button
                type="submit"
                class="auth-button">
                Login
            </button>

            <div
                id="loginMessage"
                class="auth-message">
            </div>

        </form>

        <!-- REGISTER -->

        <form
            id="registerForm"
            class="auth-form">

            <label>Username</label>

            <input
                type="text"
                id="registerUsername"
                required>

            <label>Password</label>

            <input
                type="password"
                id="registerPassword"
                required>

            <label>Confirm Password</label>

            <input
                type="password"
                id="registerConfirm"
                required>

            <button
                type="submit"
                class="auth-button">
                Create Account
            </button>

            <div
                id="registerMessage"
                class="auth-message">
            </div>

        </form>

    </div>

</div>


<!-- =========================================================
     MAIN APP
========================================================= -->

<div id="appPage">

    <header>

        <div class="header-inner">

            <div class="logo">
                🏪 Mini Mart
            </div>

            <div class="welcome">
                Welcome,
                <strong id="welcomeUsername"></strong>
            </div>

            <div class="header-actions">

                <button
                    class="header-button"
                    onclick="openCart()">

                    🛒 Cart

                    <span
                        id="cartCount"
                        class="cart-count">
                        0
                    </span>

                </button>

                <button
                    class="header-button"
                    onclick="openHistory()">

                    📜 Order History

                </button>

                <button
                    class="header-button"
                    onclick="logout()">

                    Logout

                </button>

            </div>

        </div>

    </header>


    <!-- CATEGORY NAV -->

    <nav class="category-nav">

        <div class="category-nav-inner">

            <button
                class="category-button"
                onclick="scrollToCategory('cookies')">
                Cookies
            </button>

            <button
                class="category-button"
                onclick="scrollToCategory('snacks')">
                Snacks
            </button>

            <button
                class="category-button"
                onclick="scrollToCategory('drinks')">
                Drinks
            </button>

            <button
                class="category-button"
                onclick="scrollToCategory('ramen')">
                Instant Ramen
            </button>

            <button
                class="category-button"
                onclick="scrollToCategory('donuts')">
                Donuts
            </button>

            <button
                class="category-button"
                onclick="scrollToCategory('giftcards')">
                Gift Cards
            </button>

            <button
                class="category-button"
                onclick="openHistory()">
                Order History
            </button>

        </div>

    </nav>


    <!-- PRODUCTS -->

    <main class="container">

        <!-- COOKIES -->

        <section
            id="cookies"
            class="category-section">

            <h2 class="category-title">
                Cookies
            </h2>

            <div
                id="cookiesProducts"
                class="product-grid">
            </div>

        </section>


        <!-- SNACKS -->

        <section
            id="snacks"
            class="category-section">

            <h2 class="category-title">
                Snacks
            </h2>

            <div
                id="snacksProducts"
                class="product-grid">
            </div>

        </section>


        <!-- DRINKS -->

        <section
            id="drinks"
            class="category-section">

            <h2 class="category-title">
                Drinks
            </h2>

            <div
                id="drinksProducts"
                class="product-grid">
            </div>

        </section>


        <!-- RAMEN -->

        <section
            id="ramen"
            class="category-section">

            <h2 class="category-title">
                Instant Ramen
            </h2>

            <div
                id="ramenProducts"
                class="product-grid">
            </div>

        </section>


        <!-- DONUTS -->

        <section
            id="donuts"
            class="category-section">

            <h2 class="category-title">
                Donuts
            </h2>

            <div
                id="donutsProducts"
                class="product-grid">
            </div>

        </section>


        <!-- GIFT CARDS -->

        <section
            id="giftcards"
            class="category-section">

            <h2 class="category-title">
                Gift Cards
            </h2>

            <div
                id="giftcardsProducts"
                class="product-grid">
            </div>

        </section>

    </main>

</div>


<!-- =========================================================
     OVERLAY
========================================================= -->

<div
    id="overlay"
    class="overlay"
    onclick="closeAllModals()">
</div>


<!-- =========================================================
     CART
========================================================= -->

<aside id="cartSidebar">

    <div class="cart-header">

        <h2>🛒 Your Cart</h2>

        <button
            class="close-button"
            onclick="closeCart()">
            ×
        </button>

    </div>

    <div id="cartItems"></div>

    <div class="cart-total">

        Total:
        <span id="cartTotal">
            $0
        </span>

    </div>

    <button
        class="checkout-button"
        onclick="openCheckout()">

        Proceed to Checkout

    </button>

</aside>


<!-- =========================================================
     CHECKOUT
========================================================= -->

<div id="checkoutModal">

    <div class="cart-header">

        <h2>Checkout</h2>

        <button
            class="close-button"
            onclick="closeCheckout()">
            ×
        </button>

    </div>

    <form id="checkoutForm">

        <p>
            Order Number:
            <strong id="checkoutOrderNumber"></strong>
        </p>

        <label for="customerName">
            Name
        </label>

        <input
            id="customerName"
            type="text"
            required>


        <label for="customerEmail">
            Email
        </label>

        <input
            id="customerEmail"
            type="email"
            required>


        <label for="customerPhone">
            Phone Number
        </label>

        <input
            id="customerPhone"
            type="text">


        <label for="customerNotes">
            Additional Notes
        </label>

        <textarea
            id="customerNotes">
        </textarea>


        <div class="form-buttons">

            <button
                type="button"
                class="cancel-button"
                onclick="closeCheckout()">

                Cancel

            </button>

            <button
                type="submit"
                class="submit-button">

                Place Order

            </button>

        </div>

    </form>

</div>


<!-- =========================================================
     THANK YOU
========================================================= -->

<div id="thankYouModal">

    <h2>
        Thank You!
    </h2>

    <p>
        Your order has been received.
    </p>

    <div class="order-number">

        Order #
        <span id="thankYouOrderNumber"></span>

    </div>

    <p>
        Your order has been saved successfully.
    </p>

    <br>

    <button
        class="header-button"
        onclick="closeThankYou()">

        Continue Shopping

    </button>

</div>


<!-- =========================================================
     ORDER HISTORY
========================================================= -->

<div id="historyModal">

    <div class="cart-header">

        <h2>
            📜 Order History
        </h2>

        <button
            class="close-button"
            onclick="closeHistory()">

            ×

        </button>

    </div>

    <div id="historyContent">

        Loading...

    </div>

</div>

            {
                id: "giftcard-2",
                name: "Google Play Gift Card",
                price: 500
            }

        ]

    };


    /* ========================================================
       CART
    ======================================================== */

    let cart = [];

    let quantities = {};

    let currentCheckoutOrderNumber = null;


    /* ========================================================
       AUTH TABS
    ======================================================== */

    function showAuthForm(form) {

        document
            .getElementById("loginTab")
            .classList
            .remove("active");

        document
            .getElementById("registerTab")
            .classList
            .remove("active");

        document
            .getElementById("loginForm")
            .classList
            .remove("active");

        document
            .getElementById("registerForm")
            .classList
            .remove("active");


        if (form === "login") {

            document
                .getElementById("loginTab")
                .classList
                .add("active");

            document
                .getElementById("loginForm")
                .classList
                .add("active");

        } else {

            document
                .getElementById("registerTab")
                .classList
                .add("active");

            document
                .getElementById("registerForm")
                .classList
                .add("active");

        }

    }


    /* ========================================================
       AUTH MESSAGE
    ======================================================== */

    function showMessage(
        elementId,
        message,
        type
    ) {

        const element =
            document.getElementById(elementId);

        element.textContent = message;

        element.className =
            "auth-message " + type;

    }


    /* ========================================================
       REGISTER
    ======================================================== */

    document
        .getElementById("registerForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const username =
                    document
                        .getElementById(
                            "registerUsername"
                        )
                        .value
                        .trim();

                const password =
                    document
                        .getElementById(
                            "registerPassword"
                        )
                        .value;

                const confirm =
                    document
                        .getElementById(
                            "registerConfirm"
                        )
                        .value;


                if (!username) {

                    showMessage(
                        "registerMessage",
                        "Please enter a username.",
                        "error"
                    );

                    return;

                }


                if (password !== confirm) {

                    showMessage(
                        "registerMessage",
                        "Passwords do not match.",
                        "error"
                    );

                    return;

                }


                if (password.length < 4) {

                    showMessage(
                        "registerMessage",
                        "Password must be at least 4 characters.",
                        "error"
                    );

                    return;

                }


                try {

                    const ref =
                        database.ref(
                            "users/" + username
                        );

                    const snapshot =
                        await ref.once("value");


                    if (snapshot.exists()) {

                        showMessage(
                            "registerMessage",
                            "Username already exists.",
                            "error"
                        );

                        return;

                    }


                    await ref.set({

                        password: password,

                        createdAt:
                            new Date().toISOString()

                    });


                    showMessage(
                        "registerMessage",
                        "Account created successfully! You can now login.",
                        "success"
                    );


                    document
                        .getElementById(
                            "registerForm"
                        )
                        .reset();


                } catch (error) {

                    console.error(error);

                    showMessage(
                        "registerMessage",
                        "Registration failed: " +
                        error.message,
                        "error"
                    );

                }

            }
        );


    /* ========================================================
       LOGIN
    ======================================================== */

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const username =
                    document
                        .getElementById(
                            "loginUsername"
                        )
                        .value
                        .trim();

                const password =
                    document
                        .getElementById(
                            "loginPassword"
                        )
                        .value;


                try {

                    const snapshot =
                        await database
                            .ref(
                                "users/" +
                                username
                            )
                            .once("value");


                    if (!snapshot.exists()) {

                        showMessage(
                            "loginMessage",
                            "Username not found.",
                            "error"
                        );

                        return;

                    }


                    const user =
                        snapshot.val();


                    if (
                        user.password !==
                        password
                    ) {

                        showMessage(
                            "loginMessage",
                            "Incorrect password.",
                            "error"
                        );

                        return;

                    }


                    localStorage.setItem(
                        "isLoggedIn",
                        "true"
                    );

                    localStorage.setItem(
                        "currentUser",
                        username
                    );


                    loadApp();

                } catch (error) {

                    console.error(error);

                    showMessage(
                        "loginMessage",
                        "Login failed: " +
                        error.message,
                        "error"
                    );

                }

            }
        );


    /* ========================================================
       LOAD APP
    ======================================================== */

    function loadApp() {

        const loggedIn =
            localStorage.getItem(
                "isLoggedIn"
            );

        const username =
            localStorage.getItem(
                "currentUser"
            );


        if (
            loggedIn !== "true" ||
            !username
        ) {

            document
                .getElementById(
                    "authPage"
                )
                .style
                .display = "flex";

            document
                .getElementById(
                    "appPage"
                )
                .style
                .display = "none";

            return;

        }


        document
            .getElementById(
                "authPage"
            )
            .style
            .display = "none";


        document
            .getElementById(
                "appPage"
            )
            .style
            .display = "block";


        document
            .getElementById(
                "welcomeUsername"
            )
            .textContent = username;


        renderProducts();

        updateCart();

    }


    /* ========================================================
       RENDER PRODUCTS
    ======================================================== */

    function renderProducts() {

        Object.keys(products)
            .forEach(category => {

                const container =
                    document.getElementById(
                        category + "Products"
                    );


                if (!container) {
                    return;
                }


                container.innerHTML = "";


                products[category]
                    .forEach(product => {

                        quantities[
                            product.id
                        ] = 1;


                        const card =
                            document.createElement(
                                "div"
                            );

                        card.className =
                            "product-card";


                        card.innerHTML = `

                            <div class="product-image">
                                📦
                            </div>

                            <div class="product-name">
                                ${product.name}
                            </div>

                            <div class="product-price">
                                $${product.price}
                            </div>

                            <div class="quantity-row">

                                <button
                                    onclick="changeQuantity(
                                        '${product.id}',
                                        -1
                                    )">
                                    −
                                </button>

                                <span
                                    class="quantity-value"
                                    id="qty-${product.id}">
                                    1
                                </span>

                                <button
                                    onclick="changeQuantity(
                                        '${product.id}',
                                        1
                                    )">
                                    +
                                </button>

                            </div>

                            <button
                                class="add-button"
                                onclick="addToCart(
                                    '${product.id}'
                                )">

                                Add to Cart

                            </button>

                        `;


                        container.appendChild(
                            card
                        );

                    });

            });

    }


    /* ========================================================
       CHANGE QUANTITY
    ======================================================== */

    function changeQuantity(
        productId,
        amount
    ) {

        if (!quantities[productId]) {

            quantities[productId] = 1;

        }


        quantities[productId] += amount;


        if (
            quantities[productId] <
            1
        ) {

            quantities[productId] = 1;

        }


        const element =
            document.getElementById(
                "qty-" + productId
            );


        if (element) {

            element.textContent =
                quantities[productId];

        }

    }


    /* ========================================================
       FIND PRODUCT
    ======================================================== */

    function findProduct(id) {

        for (
            const category of Object.values(products)
        ) {

            const product =
                category.find(
                    p => p.id === id
                );

            if (product) {

                return product;

            }

        }

        return null;

    }


    /* ========================================================
       ADD TO CART
    ======================================================== */

    function addToCart(id) {

        const product =
            findProduct(id);


        if (!product) {
            return;
        }


        const quantity =
            quantities[id] || 1;


        // Same behavior as the original JS:
        // each click creates a separate cart entry.
        cart.push({

            id: product.id,

            name: product.name,

            price: product.price,

            quantity: quantity

        });


        quantities[id] = 1;


        const quantityElement =
            document.getElementById(
                "qty-" + id
            );


        if (quantityElement) {

            quantityElement.textContent =
                "1";

        }


        updateCart();

    }


    /* ========================================================
       CART TOTAL
    ======================================================== */

    function getCartTotal() {

        return cart.reduce(
            (total, item) => {

                return total +
                    (
                        item.price *
                        item.quantity
                    );

            },
            0
        );

    }


    /* ========================================================
       CART COUNT
    ======================================================== */

    function getCartCount() {

        return cart.reduce(
            (count, item) => {

                return count +
                    item.quantity;

            },
            0
        );

    }


    /* ========================================================
       UPDATE CART
    ======================================================== */

    function updateCart() {

        document
            .getElementById(
                "cartCount"
            )
            .textContent =
            getCartCount();


        document
            .getElementById(
                "cartTotal"
            )
            .textContent =
            "$" +
            getCartTotal();


        const container =
            document.getElementById(
                "cartItems"
            );


        container.innerHTML = "";


        if (cart.length === 0) {

            container.innerHTML =
                "<p>Your cart is empty.</p>";

            return;

        }


        cart.forEach(
            (item, index) => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "cart-item";


                div.innerHTML = `

                    <div class="cart-item-top">

                        <div>

                            <div class="cart-item-name">
                                ${item.name}
                            </div>

                            <div>
                                Quantity:
                                ${item.quantity}
                            </div>

                        </div>

                        <div class="cart-item-price">
                            $${item.price * item.quantity}
                        </div>

                    </div>

                    <button
                        class="remove-cart"
                        onclick="removeFromCart(
                            ${index}
                        )">

                        Remove

                    </button>

                `;


                container.appendChild(
                    div
                );

            }
        );

    }


    /* ========================================================
       REMOVE FROM CART
    ======================================================== */

    function removeFromCart(index) {

        cart.splice(
            index,
            1
        );

        updateCart();

    }


    /* ========================================================
       CART OPEN / CLOSE
    ======================================================== */

    function openCart() {

        document
            .getElementById(
                "overlay"
            )
            .classList
            .add("active");

        document
            .getElementById(
                "cartSidebar"
            )
            .classList
            .add("active");

        updateCart();

    }


    function closeCart() {

        document
            .getElementById(
                "cartSidebar"
            )
            .classList
            .remove("active");

        document
            .getElementById(
                "overlay"
            )
            .classList
            .remove("active");

    }


    /* ========================================================
       CHECKOUT
    ======================================================== */

    function openCheckout() {

        if (cart.length === 0) {

            alert(
                "Your cart is empty."
            );

            return;

        }


        currentCheckoutOrderNumber =
            Math.floor(
                100000 +
                Math.random() * 900000
            );


        document
            .getElementById(
                "checkoutOrderNumber"
            )
            .textContent =
            currentCheckoutOrderNumber;


        document
            .getElementById(
                "overlay"
            )
            .classList
            .add("active");


        document
            .getElementById(
                "cartSidebar"
            )
            .classList
            .remove("active");


        document
            .getElementById(
                "checkoutModal"
            )
            .classList
            .add("active");

    }


    function closeCheckout() {

        document
            .getElementById(
                "checkoutModal"
            )
            .classList
            .remove("active");


        document
            .getElementById(
                "overlay"
            )
            .classList
            .remove("active");

    }


    /* ========================================================
       CHECKOUT SUBMIT
    ======================================================== */

    document
        .getElementById(
            "checkoutForm"
        )
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                if (cart.length === 0) {

                    alert(
                        "Your cart is empty."
                    );

                    return;

                }


                const user =
                    localStorage.getItem(
                        "currentUser"
                    );


                const name =
                    document
                        .getElementById(
                            "customerName"
                        )
                        .value;

                const email =
                    document
                        .getElementById(
                            "customerEmail"
                        )
                        .value;

                const phone =
                    document
                        .getElementById(
                            "customerPhone"
                        )
                        .value;

                const notes =
                    document
                        .getElementById(
                            "customerNotes"
                        )
                        .value;


                const orderNumber =
                    currentCheckoutOrderNumber;


                const total =
                    getCartTotal();


                const items =
                    cart
                        .map(
                            item =>
                                `${item.name} x${item.quantity}`
                        )
                        .join("\n");


                try {

                    /* =========================
                       FIRESTORE
                    ========================= */

                    await firestore
                        .collection(
                            "orders"
                        )
                        .add({

                            username: user,

                            orderNumber:
                                orderNumber,

                            items: items,

                            total: total,

                            date:
                                new Date()
                                    .toISOString(),

                            timestamp:
                                Date.now()

                        });


                    /* =========================
                       FORMSUBMIT
                    ========================= */

                    const formData =
                        new FormData();


                    formData.append(
                        "_subject",
                        "New Mini Mart Order"
                    );

                    formData.append(
                        "_template",
                        "table"
                    );

                    formData.append(
                        "_captcha",
                        "false"
                    );

                    formData.append(
                        "Order Number",
                        orderNumber
                    );

                    formData.append(
                        "Username",
                        user
                    );

                    formData.append(
                        "Customer Name",
                        name
                    );

                    formData.append(
                        "Customer Email",
                        email
                    );

                    formData.append(
                        "Phone",
                        phone
                    );

                    formData.append(
                        "Order Items",
                        items
                    );

                    formData.append(
                        "Total",
                        "$" + total
                    );

                    formData.append(
                        "Notes",
                        notes
                    );


                    await fetch(
                        "https://formsubmit.co/clive.lin.dino@gmail.com",
                        {

                            method: "POST",

                            body: formData,

                            mode: "no-cors"

                        }
                    );


                    /* =========================
                       FINISH
                    ========================= */

                    cart = [];

                    updateCart();

                    closeCheckout();


                    document
                        .getElementById(
                            "thankYouOrderNumber"
                        )
                        .textContent =
                        orderNumber;


                    document
                        .getElementById(
                            "overlay"
                        )
                        .classList
                        .add("active");


                    document
                        .getElementById(
                            "thankYouModal"
                        )
                        .classList
                        .add("active");


                } catch (error) {

                    console.error(error);

                    alert(
                        "There was an error placing your order:\n" +
                        error.message
                    );

                }

            }
        );


    /* ========================================================
       THANK YOU
    ======================================================== */

    function closeThankYou() {

        document
            .getElementById(
                "thankYouModal"
            )
            .classList
            .remove("active");


        document
            .getElementById(
                "overlay"
            )
            .classList
            .remove("active");

    }


    /* ========================================================
       ORDER HISTORY
    ======================================================== */

    async function openHistory() {

        document
            .getElementById(
                "overlay"
            )
            .classList
            .add("active");


        document
            .getElementById(
                "historyModal"
            )
            .classList
            .add("active");


        const container =
            document.getElementById(
                "historyContent"
            );


        container.innerHTML =
            "<p>Loading orders...</p>";


        const user =
            localStorage.getItem(
                "currentUser"
            );


        try {

            const snapshot =
                await firestore
                    .collection(
                        "orders"
                    )
                    .where(
                        "username",
                        "==",
                        user
                    )
                    .get();


            const orders =
                [];


            snapshot.forEach(
                doc => {

                    orders.push({
                        id: doc.id,
                        ...doc.data()
                    });

                }
            );


            orders.sort(
                (
                    a,
                    b
                ) =>
                    (
                        b.timestamp || 0
                    ) -
                    (
                        a.timestamp || 0
                    )
            );


            if (orders.length === 0) {

                container.innerHTML =
                    "<p>No orders yet.</p>";

                return;

            }


            container.innerHTML = "";


            orders.forEach(
                order => {

                    const div =
                        document.createElement(
                            "div"
                        );

                    div.className =
                        "history-order";


                    div.innerHTML = `

                        <h3>
                            Order #${order.orderNumber}
                        </h3>

                        <p>
                            Total:
                            $${order.total}
                        </p>

                        <p>
                            Date:
                            ${new Date(
                                order.date
                            ).toLocaleString()}
                        </p>

                        <p>
                            Items:
                        </p>

                        <p style="white-space:pre-line;color:#aaa;">
                            ${order.items}
                        </p>

                    `;


                    container.appendChild(
                        div
                    );

                }
            );


        } catch (error) {

            console.error(error);

            container.innerHTML =
                `<p>
                    Could not load order history.
                    ${error.message}
                </p>`;

        }

    }


    function closeHistory() {

        document
            .getElementById(
                "historyModal"
            )
            .classList
            .remove("active");


        document
            .getElementById(
                "overlay"
            )
            .classList
            .remove("active");

    }


    /* ========================================================
       SCROLL TO CATEGORY
    ======================================================== */

    function scrollToCategory(
        category
    ) {

        const element =
            document.getElementById(
                category
            );


        if (element) {

            element.scrollIntoView({
                behavior: "smooth"
            });

        }

    }


    /* ========================================================
       CLOSE ALL MODALS
    ======================================================== */

    function closeAllModals() {

        closeCart();
        closeCheckout();
        closeHistory();
        closeThankYou();

    }


    /* ========================================================
       LOGOUT
    ======================================================== */

    function logout() {

        localStorage.removeItem(
            "isLoggedIn"
        );

        localStorage.removeItem(
            "currentUser"
        );

        cart = [];

        document
            .getElementById(
                "appPage"
            )
            .style
            .display = "none";


        document
            .getElementById(
                "authPage"
            )
            .style
            .display = "flex";


        document
            .getElementById(
                "loginForm"
            )
            .reset();


        showAuthForm("login");

    }


    /* ========================================================
       START
    ======================================================== */

    loadApp();

</script>

</body>
</html>
